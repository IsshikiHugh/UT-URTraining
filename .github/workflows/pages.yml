name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Stage pages content
        run: bash scripts/build_pages.sh

      - name: Install Jekyll
        working-directory: _build
        run: |
          cat > Gemfile <<'EOF'
          source 'https://rubygems.org'
          gem 'jekyll', '~> 4.3'
          EOF
          bundle install

      - name: Build site
        working-directory: _build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination "${GITHUB_WORKSPACE}/_site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
